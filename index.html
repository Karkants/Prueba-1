<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pantalla de selección</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <header class="screen__header">
        <p class="screen__eyebrow">Bienvenido</p>
        <h1 class="screen__title">Elige una categoría</h1>
        <p class="screen__subtitle">
          Desliza para ver más opciones y toca un botón para continuar.
        </p>
      </header>

      <section class="picker" aria-label="Opciones disponibles">
        <button class="picker__item" type="button">
          <span>Descubrir música</span>
          <small>Recomendaciones diarias</small>
        </button>
        <button class="picker__item" type="button">
          <span>Plan de entrenamiento</span>
          <small>Rutinas personalizadas</small>
        </button>
        <button class="picker__item" type="button">
          <span>Recetas rápidas</span>
          <small>Listas en 15 minutos</small>
        </button>
        <button class="picker__item" type="button">
          <span>Viajes cercanos</span>
          <small>Escapadas de fin de semana</small>
        </button>
        <button class="picker__item" type="button">
          <span>Productividad</span>
          <small>Metas y seguimiento</small>
        </button>
        <button class="picker__item" type="button">
          <span>Bienestar</span>
          <small>Respira y relájate</small>
        </button>
        <button class="picker__item" type="button">
          <span>Aprende algo nuevo</span>
          <small>Mini cursos diarios</small>
        </button>
        <button class="picker__item" type="button">
          <span>Estilo personal</span>
          <small>Looks recomendados</small>
        </button>
      </section>
    </main>
  </body>
</html>
